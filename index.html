<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calma Canina — Prueba completa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --ink: #1F2E35; --inkSoft: #4B5C63; --brand: #5C4033; --gold: #B8860B;
    --goldLight: #F5EFE0; --clay: #C97B3C; --clayLight: #FBEEE0; --bg: #F3EEE6;
    --surface: #FFFFFF; --line: #E4DCCF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); }
  .wrap { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 40px; }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  .center { text-align: center; }
  .orb { border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: breathe 7s ease-in-out infinite; margin: 0 auto; }
  .orb-inner { border-radius: 50%; transition: opacity .6s ease; }
  @keyframes breathe { 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 12px; text-align: left; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(31,46,53,.04); border-width:1px; }
  .icon-badge { width: 38px; height: 38px; border-radius: 10px; background: var(--goldLight); display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .pill { display: inline-block; background: var(--goldLight); color: var(--gold); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 6px; }
  .pill.clay { background: var(--clayLight); color: var(--clay); }
  .section-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; font-weight: 700; color: var(--brand); }
  .box { border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--inkSoft); line-height: 1.65; }
  ul.plain { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
  .badge-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 18px; flex-wrap: wrap; }
  .badge { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--inkSoft); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
  .player { background: var(--brand); border-radius: 20px; margin: 0 16px 26px; padding: 22px 18px; text-align: center; }
  .play-btn { width: 62px; height: 62px; border-radius: 50%; border: none; background: #fff; color: var(--brand); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: 22px; }
  .whatsapp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25A366; color: #fff; text-decoration: none; border-radius: 14px; padding: 13px 16px; font-size: 14px; font-weight: 700; margin-top: 14px; }
  .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--inkSoft); font-size: 13.5px; padding: 0; }
  .hidden { display: none; }
  a.textlink { color: var(--brand); text-decoration: none; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const WHATSAPP_NUMBER = "34633948286";
function whatsappLink(label) {
  const msg = label
    ? `Hola Noemí, me gustaría agendar una consulta de comportamiento. Mi perro tiene un caso relacionado con: ${label}.`
    : "Hola Noemí, me gustaría agendar una consulta de comportamiento canino.";
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

let currentTimer = null;
let currentElapsed = 0;
let currentTrackIndex = 0;
let currentCategory = null;
let currentProtocol = null;
let manualSelectionMade = false;

function orb(size, color, active) {
  return `<div class="orb" style="width:${size}px;height:${size}px;background:radial-gradient(circle at 35% 30%, ${color}55, ${color}22 60%, transparent 75%);">
    <div class="orb-inner" style="width:${size*0.55}px;height:${size*0.55}px;background:${color};opacity:${active?0.9:0.55};"></div>
  </div>`;
}

// Funciones seguras: si el navegador bloquea el almacenamiento (modo privado en algunos
// navegadores, sobre todo Safari), la app sigue funcionando igual, solo que sin recordar
// nada entre visitas, en vez de romperse por completo.
function safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* almacenamiento no disponible, seguimos sin guardar */ }
}

function getTrackIndex(category) {
  const saved = safeGet("calma-trackidx-" + category);
  return saved ? parseInt(saved, 10) || 0 : 0;
}
function setTrackIndex(category, idx) {
  safeSet("calma-trackidx-" + category, String(idx));
}
function getLastProtocol() {
  const id = safeGet("calma-last-protocol");
  return PROTOCOLS.find(p => p.id === id) || null;
}
function getDiary() {
  try { return JSON.parse(safeGet("calma-diary") || "[]"); } catch (e) { return []; }
}
function addDiaryEntry(entry) {
  const d = getDiary(); d.push(entry);
  safeSet("calma-diary", JSON.stringify(d));
}

                <div style="font-size:12px;color:var(--inkSoft);">${new Date(e.date).toLocaleString("es-ES")}</div>
              </div>
              <div style="font-size:12.5px;color:var(--gold);font-weight:600;">${Math.round(e.seconds/60)} min</div>
            </div>
          `).join("")}
        </div>
        <button onclick="safeSet('calma-diary','[]');renderDiary();" style="margin-top:20px;background:none;border:none;color:var(--clay);font-size:12.5px;text-decoration:underline;">Vaciar diario</button>`}
    </div>
  `;
}

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
}

function openProtocol(id) {
  stopAudio();
  const p = PROTOCOLS.find(x => x.id === id);
  currentProtocol = p;
  currentCategory = p.soundCategory;
  currentTrackIndex = getTrackIndex(currentCategory);
  currentElapsed = 0;
  manualSelectionMade = false;
  safeSet("calma-last-protocol", id);
  const info = SOUND_CATEGORIES[p.soundCategory];

  const app = document.getElementById("app");
  app.innerHTML = `
    <div style="padding-bottom:40px;">
      <div style="padding:16px 16px 0;"><button class="back-btn" onclick="renderHome()">← Todas las situaciones</button></div>
      <div class="center" style="padding:18px 20px 8px;">
        <div class="icon-badge" style="margin:0 auto 12px;width:46px;height:46px;font-size:22px;">${p.icon}</div>
        <h1 style="font-size:23px;color:var(--ink);margin:0 0 6px;">${p.label}</h1>
        <p style="color:var(--inkSoft);font-size:14px;margin:0 auto;max-width:320px;line-height:1.5;">${p.objetivo}</p>
      </div>
      <div class="badge-row">
        <span class="badge">🎯 ${p.cuando}</span>
        <span class="badge">⏱ ${p.duracion}</span>
      </div>

      <div class="player">
        ${orb(110, "#B8860B", false)}
        <div id="player-status" style="color:#fff;font-family:'Fraunces',serif;font-size:15px;margin-top:12px;">Listo para empezar</div>
        <div style="color:rgba(255,255,255,.75);font-size:12.5px;margin-bottom:6px;">Categoría de sonido: ${info.label}</div>
        <div id="player-variant" style="color:rgba(255,255,255,.55);font-size:11.5px;margin-bottom:16px;">${info.corto}</div>
        <div style="display:flex;justify-content:center;">
          <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
        </div>
        <div id="track-picker" style="display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;">
          ${AUDIO_TRACKS[currentCategory].map((t, i) => `
            <button onclick="selectTrack(${i})" data-track-btn="${i}" style="width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:${i===currentTrackIndex?'#fff':'rgba(255,255,255,.12)'};color:${i===currentTrackIndex?'#5C4033':'#fff'};font-size:13px;font-weight:700;cursor:pointer;">${i+1}</button>
          `).join("")}
        </div>
        <div style="color:rgba(255,255,255,.5);font-size:11px;margin-top:8px;">Elige la canción que prefieras</div>
        <div id="duration-notice" class="hidden" style="margin-top:14px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:11.5px;color:#fff;">
          Ya han pasado los ${p.avisoMinutos || ""} min recomendados. Puedes seguir si tu perro aún lo necesita, o parar cuando veas que está más tranquilo.
        </div>
      </div>

      <div style="padding:0 20px;">
        <div style="margin-bottom:22px;">
          <div class="section-title">🧠 Por qué esta situación es distinta</div>
          <p class="box" style="background:var(--goldLight);">${p.porQueDistinto}</p>
        </div>
        <div style="margin-bottom:22px;">
          <div class="section-title">🔊 Por qué esta categoría de sonido</div>
          <p class="box" style="background:var(--clayLight);">${info.explicacion}</p>
        </div>
        <div style="margin-bottom:22px;">
          <div class="section-title">🎯 Antes</div>
          <ul class="plain">${p.antes.map(t=>`<li>${t}</li>`).join("")}</ul>
        </div>
        <div style="margin-bottom:22px;">
          <div class="section-title">⏱ Durante</div>
          <ul class="plain">${p.durante.map(t=>`<li>${t}</li>`).join("")}</ul>
        </div>
        <div style="margin-bottom:22px;">
          <div class="section-title">💓 Después</div>
          <ul class="plain">${p.despues.map(t=>`<li>${t}</li>`).join("")}</ul>
        </div>
        <div style="margin-bottom:22px;">
          <div class="section-title">Lo que dice la evidencia</div>
          ${p.evidencia.map(e => `<div style="margin-bottom:8px;"><span class="pill ${(e.tag.toLowerCase().includes('débil')||e.tag.toLowerCase().includes('límite'))?'clay':''}">${e.tag}</span><p style="margin:2px 0 0;font-size:13.5px;color:var(--inkSoft);line-height:1.55;">${e.text}</p></div>`).join("")}
        </div>
        <div class="box" style="background:var(--clayLight);">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span>⚠️</span><span style="font-weight:700;font-size:14px;color:var(--clay);">Consulta a un profesional si...</span></div>
          <ul class="plain" style="color:#7A4A22;">${p.alarma.map(t=>`<li>${t}</li>`).join("")}</ul>
          <a class="whatsapp-btn" href="${whatsappLink(p.label)}" target="_blank">💬 Agendar consulta de comportamiento por WhatsApp</a>
        </div>
      </div>
    </div>
  `;
  loadTrack();
}

function loadTrack() {
  currentAudio = new Audio(AUDIO_TRACKS[currentCategory][currentTrackIndex]);
  currentAudio.loop = true;
  currentAudio.onended = () => { isPlayingUI(false); };
}

function refreshTrackPicker() {
  const tracks = AUDIO_TRACKS[currentCategory];
  tracks.forEach((t, i) => {
    const btn = document.querySelector(`[data-track-btn="${i}"]`);
    if (!btn) return;
    if (i === currentTrackIndex) {
      btn.style.background = "#fff";
      btn.style.color = "#5C4033";
    } else {
      btn.style.background = "rgba(255,255,255,.12)";
      btn.style.color = "#fff";
    }
  });
}

function selectTrack(idx) {
  const wasPlaying = currentAudio && !currentAudio.paused;
  currentTrackIndex = idx;
  manualSelectionMade = true;
  setTrackIndex(currentCategory, idx);
  loadTrack();
  refreshTrackPicker();
  if (wasPlaying) { currentAudio.play(); isPlayingUI(true); }
}

function isPlayingUI(playing) {
  const btn = document.getElementById("play-btn");
  const status = document.getElementById("player-status");
  if (!btn) return;
  btn.textContent = playing ? "⏸" : "▶";
  if (status) status.textContent = playing ? formatTime(currentElapsed) : "Listo para empezar";
}

function formatTime(s) {
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return `${mm}:${ss}`;
}

function togglePlay() {
  if (!currentAudio) return;
  if (!currentAudio.paused) {
    currentAudio.pause();
    if (currentTimer) { clearInterval(currentTimer); currentTimer = null; }
    isPlayingUI(false);
    if (currentElapsed >= 20 && currentProtocol) {
      addDiaryEntry({ protocolLabel: currentProtocol.label, seconds: currentElapsed, date: new Date().toISOString() });
    }
  } else {
    // Rotacion Anti-Habituacion automatica: si es el comienzo de una sesion nueva
    // (no venimos de pausa) y nadie ha elegido pista a mano, avanza sola, sin tocar nada.
    const tracks = AUDIO_TRACKS[currentCategory];
    if (tracks.length > 1 && currentElapsed === 0 && !manualSelectionMade) {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      setTrackIndex(currentCategory, currentTrackIndex);
      loadTrack();
      refreshTrackPicker();
    }
    currentAudio.play();
    isPlayingUI(true);
    currentTimer = setInterval(() => {
      currentElapsed++;
      const status = document.getElementById("player-status");
      if (status) status.textContent = formatTime(currentElapsed);
      if (currentProtocol.avisoMinutos && currentElapsed === currentProtocol.avisoMinutos * 60) {
        const n = document.getElementById("duration-notice");
        if (n) n.classList.remove("hidden");
      }
    }, 1000);
  }
}

renderHome();
</script>
</body>
</html>
